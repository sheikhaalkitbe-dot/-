<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار أنماط الشخصية بالألوان الأربعة</title><style>:root{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;color:#243047;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:25px 14px}.wrap{max-width:760px;margin:auto}.panel{background:white;border:1px solid #e3e8f1;border-radius:20px;padding:26px;box-shadow:0 8px 30px #2030500b}h1{font-size:clamp(24px,5vw,34px);margin:0 0 10px}p{line-height:1.9;color:#596477}.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:20px 0}.chip{text-align:center;background:#f5f7fa;border-radius:12px;padding:12px 4px;font-size:13px}.chip b{display:block;font-size:24px}.muted{color:#667085;font-size:14px}.field{display:block;margin:18px 0 8px;font-weight:600}input[type=text]{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.top{display:flex;justify-content:space-between;align-items:center;margin-top:22px}.progress{height:8px;background:#e9edf5;border-radius:20px;overflow:hidden;margin:12px 0 26px}.fill{height:100%;background:#415d93;transition:width .2s}h2{font-size:21px;line-height:1.7}.option{display:flex;align-items:center;gap:10px;padding:15px;border:1px solid #dce3ed;border-radius:12px;margin:10px 0;cursor:pointer;line-height:1.6}.option:has(input:checked){background:#edf3ff;border-color:#557cc0}.option input{accent-color:#4164a5;flex-shrink:0}.buttons{display:flex;justify-content:space-between;gap:12px;margin-top:25px}button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:12px 20px;background:#314e85;color:white;font-weight:650}button.secondary{background:#e9edf4;color:#344054}button:disabled{opacity:.4;cursor:not-allowed}.bar{height:12px;border-radius:20px;background:#e9edf5;overflow:hidden}.bar>div{height:100%;border-radius:20px}.score{margin:18px 0}.scoreline{display:flex;justify-content:space-between;margin-bottom:7px}.result-title{text-align:center;font-size:28px}.note{font-size:13px;border-top:1px solid #e4e8f0;padding-top:14px;margin-top:22px}@media(max-width:480px){.panel{padding:17px}.chips{grid-template-columns:repeat(2,1fr)}button{padding:12px}}</style></head><body><main class="wrap"><section class="panel"><h1>اختبار أنماط الشخصية بالألوان الأربعة</h1><p>نشاط تفاعلي لموظفي الإدارة — 20 سؤالاً، يستغرق نحو 5 دقائق. اختر الإجابة الأقرب لتصرفك الفعلي في بيئة العمل، ولا توجد إجابات صحيحة أو خاطئة.</p><div class="chips"><div class="chip"><b>💚</b>الأخضر<br>التحليلي</div><div class="chip"><b>💙</b>الأزرق<br>الاجتماعي</div><div class="chip"><b>🧡</b>البرتقالي<br>المبادر</div><div class="chip"><b>💛</b>الذهبي<br>المنظم</div></div><div id="app"></div></section></main><script>
const questions=[
['عند تكليفك بمهمة جديدة، ما أول خطوة تقوم بها؟',['دراسة التفاصيل وفهم المتطلبات','التواصل مع المعنيين وفهم توقعاتهم','البدء بالتنفيذ وتجربة الحلول','إعداد خطة عمل وتحديد الأولويات']],
['عند حدوث مشكلة مفاجئة في العمل، كيف تتصرف؟',['تحليل الأسباب قبل اتخاذ أي إجراء','التشاور مع الزملاء للوصول إلى حل','اتخاذ إجراء سريع للسيطرة على الوضع','اتباع الإجراءات المعتمدة لمعالجة المشكلة']],
['ما أكثر ما يحفزك في بيئة العمل؟',['حل المشكلات المعقدة واكتساب المعرفة','العلاقات الإيجابية والتقدير','التحديات الجديدة وحرية المبادرة','الإنجاز والاستقرار ووضوح المسؤوليات']],
['كيف تتعامل مع اختلاف الرأي في اجتماع؟',['تقديم الأدلة والبراهين لدعم رأيك','الاستماع للجميع ومحاولة التوفيق','مناقشة الموضوع بصراحة وحسم','الرجوع إلى الأنظمة والمعايير المعتمدة']],
['إذا كان لديك عدة مهام عاجلة، كيف تتصرف؟',['تقييم أهمية كل مهمة وتحليل الخيارات','التنسيق مع الزملاء لتوزيع الجهد','البدء بالمهمة التي يمكن إنجازها فوراً','ترتيب المهام حسب الأولوية والموعد']],
['كيف يصفك زملاؤك غالباً؟',['دقيق في التفكير وتحب التحليل','متعاون ومتفهم للآخرين','مبادر وسريع التصرف','ملتزم ومنظم ويمكن الاعتماد عليك']],
['عند تقديم فكرة جديدة للإدارة، على ماذا تركز؟',['الدراسات والبيانات التي تثبت جدواها','الفوائد التي ستعود على الموظفين والمتعاملين','فرص الابتكار وسرعة تطبيق الفكرة','خطة التنفيذ والموارد والمواعيد']],
['كيف تتعامل مع التغيير المفاجئ في إجراءات العمل؟',['تبحث عن أسباب التغيير وتأثيراته','تهتم بتأثير التغيير على الفريق','تتأقلم بسرعة وتعتبره فرصة','تفضل وجود تعليمات وخطة انتقال واضحة']],
['ما نوع الاجتماعات الذي تفضله؟',['اجتماعات تحليل المشكلات ومناقشة الحلول','اجتماعات العصف الذهني والتعاون','اجتماعات قصيرة تنتهي بقرارات سريعة','اجتماعات منظمة بجدول أعمال ومخرجات']],
['عند مواجهة قرار صعب، على ماذا تعتمد؟',['المعلومات والمنطق والمقارنة بين البدائل','تأثير القرار على الأشخاص المعنيين','الخبرة العملية وسرعة التقدير','اللوائح والإجراءات وتقييم المخاطر']],
['كيف تتعامل مع موظف جديد في الفريق؟',['تشرح له طبيعة العمل والمعلومات الفنية','ترحب به وتساعده على الاندماج','تشجعه على المشاركة والتجربة','توضح له المهام والمسؤوليات والإجراءات']],
['ما أكثر سلوك يزعجك في بيئة العمل؟',['القرارات التي لا تستند إلى معلومات','عدم الاحترام أو ضعف التعاون','البطء والروتين المبالغ فيه','الفوضى وعدم الالتزام بالمواعيد']],
['عندما تتلقى ملاحظة على أدائك، كيف تتصرف؟',['تحلل الملاحظة وتطلب أمثلة واضحة','تهتم بأسلوب تقديم الملاحظة وتتقبل الحوار','تسعى لتطبيق التحسين فوراً','تضع خطوات تصحيحية لمنع تكرار الملاحظة']],
['أي مهمة تفضل تولي مسؤوليتها؟',['إعداد الدراسات والتحليلات الفنية','تنسيق الفرق والتواصل مع الجهات','قيادة مبادرة أو تنفيذ تجربة جديدة','إدارة الخطط والجداول ومتابعة الإنجاز']],
['إذا تأخر أحد أعضاء الفريق عن تسليم مهمة، ماذا تفعل؟',['تبحث عن السبب الحقيقي للتأخير','تتحدث معه وتعرض المساعدة','تبحث عن بديل سريع لإنجاز المهمة','تتابع الموعد وتحدد إجراءً تصحيحياً']],
['كيف تتصرف أثناء ضغط العمل الشديد؟',['تركز على فهم المشكلة وترتيب الحلول منطقياً','تطلب التعاون والدعم المتبادل','تعمل بسرعة وتتعامل مع المستجدات مباشرة','تلتزم بخطة واضحة وتتابع الأولويات']],
['ما الذي يجعلك تثق في قائد الفريق؟',['خبرته وكفاءته وقدرته على التحليل','عدالته واهتمامه بالموظفين','شجاعته في اتخاذ القرارات','التزامه ووضوح توجيهاته']],
['كيف تفضل تعلم مهارة جديدة؟',['قراءة التفاصيل وفهم المبادئ الأساسية','التعلم بالمناقشة وتبادل الخبرات','التطبيق العملي والتجربة المباشرة','اتباع برنامج تدريبي منظم خطوة بخطوة']],
['عند تحقيق إنجاز جماعي، ما أكثر ما يسعدك؟',['الوصول إلى حل متميز ومدروس','نجاح الفريق وتقدير جهود الجميع','تحقيق نتيجة ملموسة ومبتكرة','إنجاز العمل بالمستوى والوقت المحددين']],
['ما الصفة التي تعبر عن أسلوبك المهني أكثر؟',['التفكير النقدي والبحث عن المعرفة','التعاطف والتواصل وبناء العلاقات','المبادرة والمرونة والجرأة','المسؤولية والانضباط والتنظيم']]
];
const names=['الأخضر','الأزرق','البرتقالي','الذهبي'],icons=['💚','💙','🧡','💛'],hex=['#2e9b62','#3b83ce','#e48a32','#c5a12e'];const descriptions=['تميل إلى التفكير المنطقي والبحث عن الأدلة وفهم الأسباب قبل اتخاذ القرارات.','تهتم بالعلاقات الإنسانية والتعاون وبناء بيئة عمل إيجابية.','تحب التحديات والتجارب الجديدة وتتميز بالمرونة وسرعة الاستجابة.','تقدر المسؤولية والانضباط وتفضل التخطيط والإجراءات الواضحة.'];let current=0,answers=Array(20).fill(null),participant='';const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let done=answers.filter(x=>x!==null).length;app.innerHTML=`<label class="field" for="person">اسم المشارك (اختياري)</label><input id="person" type="text" placeholder="الاسم أو الرقم الوظيفي" value="${esc(participant)}"><div class="top"><strong>السؤال ${current+1} من 20</strong><span class="muted">${done*5}% مكتمل</span></div><div class="progress"><div class="fill" style="width:${done*5}%"></div></div><h2>${questions[current][0]}</h2>${questions[current][1].map((a,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${answers[current]===i?'checked':''}><span>${a}</span></label>`).join('')}<div class="buttons"><button class="secondary" id="prev" ${current===0?'disabled':''}>السابق</button><button id="next" ${answers[current]===null||current===19&&done<20?'disabled':''}>${current===19?'عرض النتيجة':'التالي'}</button></div>`;document.getElementById('person').oninput=e=>participant=e.target.value;document.querySelectorAll('[name=answer]').forEach(r=>r.onchange=e=>{answers[current]=+e.target.value;render()});document.getElementById('prev').onclick=()=>{current--;render()};document.getElementById('next').onclick=()=>{if(current<19){current++;render()}else result()}}function result(){const scores=names.map((_,i)=>answers.filter(x=>x===i).length),order=[0,1,2,3].sort((a,b)=>scores[b]-scores[a]||a-b),top=order[0];app.innerHTML=`<div class="result-title">${participant?`<p>${esc(participant)}</p>`:''}<div>نتيجة اختبار الشخصية</div><h2 style="font-size:30px">${icons[top]} ${names[top]}</h2></div><p style="text-align:center">${descriptions[top]}</p><p style="text-align:center">اللون الثانوي: ${icons[order[1]]} ${names[order[1]]}${scores[top]===scores[order[1]]?' (تعادل في أعلى نتيجة)':''}</p><h2>توزيع أنماط الشخصية</h2>${order.map(i=>`<div class="score"><div class="scoreline"><strong>${icons[i]} ${names[i]}</strong><span>${scores[i]*5}%</span></div><div class="bar"><div style="width:${scores[i]*5}%;background:${hex[i]}"></div></div></div>`).join('')}<p class="note">هذا اختبار استكشافي غير معياري، ولا يُستخدم لتقييم الكفاءة أو الأداء الوظيفي. النسب تمثل توزيع الإجابات، وليست مقياساً علمياً للسمات.</p><div class="buttons"><button class="secondary" id="restart">اختبار لمشارك آخر</button><button id="copy">نسخ النتيجة</button></div>`;document.getElementById('restart').onclick=()=>{current=0;answers=Array(20).fill(null);participant='';render()};document.getElementById('copy').onclick=async()=>{const s=`المشارك: ${participant||'غير محدد'}\nالنمط الأقرب: ${names[top]}\nالنمط الثانوي: ${names[order[1]]}\n`+order.map(i=>`${names[i]}: ${scores[i]*5}%`).join('\n');try{await navigator.clipboard.writeText(s);alert('تم نسخ النتيجة')}catch(e){prompt('انسخ النتيجة:',s)}}}render();</script></body></html>
